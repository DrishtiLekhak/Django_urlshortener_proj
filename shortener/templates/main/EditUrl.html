{% extends 'base.html' %}

{% block title %}
Edit URL
{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card p-4 shadow-sm" style="max-width: 500px; width: 100%;">

        <h3 class="text-center mb-4">Enter New URL</h3>

        <form method="POST" action="{% url 'edit_url' url.id %}">
            {% csrf_token %}

            <!-- Input -->
            <div class="mb-3">
                <label class="form-label">URL</label>
                <input 
                    type="url" 
                    name="original_url" 
                    class="form-control"
                    value="{{url.original_url}}"
                    placeholder="Enter new URL"
                    required
                >
            </div>

            <div class="d-grid mb-2">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
        </div>

        <div class="d-grid">
            <a href="{% url 'dashboard_page' %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>

        </form>

    </div>

</div>

{% endblock %}
