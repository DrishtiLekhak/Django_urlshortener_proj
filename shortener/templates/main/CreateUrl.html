{% extends 'base.html' %}

{% block content %}

<div class="card p-3">

    <h2 style="color:#111827;">
        Create Short URL
    </h2>

    <form method="POST" action="{% url 'create_url' %}">
        {% csrf_token %}

        <input type="url"
               name="original_url"
               placeholder="Enter URL"
               required
               style="
                    width:100%;
                    padding:10px;
                    margin-top:10px;
                    border:1px solid #ccc;
                    border-radius:6px;
               ">

        <button type="submit" style="
                background:#2563eb;
                color:white;
                border:none;
                padding:10px 15px;
                border-radius:6px;
                width:100%;
                margin-top:15px;
        ">
            Create
        </button>

    </form>

</div>

{% endblock %}
