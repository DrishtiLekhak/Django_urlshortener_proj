{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>Create Short URL</h2>

    <form method="POST" action="{% url 'create_url' %}">
        {% csrf_token %}

        <input type="url" name="original_url" placeholder="Enter URL" required>

        <button type="submit" class="mt-3">
            Create
        </button>

    </form>

</div>

{% endblock %}
