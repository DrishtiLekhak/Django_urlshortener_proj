<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock title %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body style="background:#f4f6f8;">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#111827;">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="{% url 'index_page' %}">
            URL Shortener
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto text-center">

                <li class="nav-item">
                    <a class="nav-link" style="color:#ffffff;" href="{% url 'index_page' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" style="color:#ffffff;" href="{% url 'dashboard_page' %}">Dashboard</a>
                </li>

                {% if user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link" style="color:#ffffff;" href="{% url 'logout_page' %}">Logout</a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" style="color:#ffffff;" href="{% url 'login_page' %}">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" style="color:#ffffff;" href="{% url 'register_page' %}">Register</a>
                </li>

                {% endif %}

            </ul>

        </div>
    </div>
</nav>

<!-- MAIN CONTAINER -->
<div class="container py-4">

    {% block content %}
    {% endblock content %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
