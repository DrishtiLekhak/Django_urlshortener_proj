{% extends 'base.html' %}

{% block content %}

<div class="container mt-5" style="max-width: 550px;">
    <div class="card shadow p-4">

        <h3 class="text-center mb-3">Create Account</h3>

        {% if messages %}
            {% for m in messages %}
               {% if m.tags == 'success' %}

               <p class="text-center text-success">{{m}}</p>

               {% else %}
                <p class="text-center text-danger">{{m}}</p>
                 
               {% endif %}
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register_page' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="firstName" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="lastName" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirmpassword" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="{% url 'login_page' %}">Login</a>
        </p>

    </div>
</div>

{% endblock %}
